<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f2ea;
        --bg-2: #eef5ff;
        --ink: #161616;
        --muted: #6e6a63;
        --card: #ffffff;
        --border: #e7e1d7;
        --accent: #2869ff;
        --shadow: 0 18px 40px rgba(19, 21, 27, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Space Grotesk", "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at 10% 10%, #ffffff 0%, var(--bg) 45%)
            no-repeat,
          radial-gradient(circle at 80% 0%, #f0f7ff 0%, transparent 55%)
            no-repeat,
          linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
        min-height: 100vh;
      }
      .wrap {
        max-width: 900px;
        margin: 32px auto 80px;
        padding: 0 20px;
        animation: fadeIn 0.5s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
        box-shadow: var(--shadow);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }
      .meta {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 14px;
      }
      pre {
        background: #f3f4f6;
        border: 1px dashed var(--border);
        border-radius: 10px;
        padding: 12px;
        overflow: auto;
      }
      a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      .actions {
        display: flex;
        gap: 12px;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>{{ title }}</h1>
        <div class="meta">Created at: {{ report.created_at }}</div>
        <div class="actions">
          <a href="{{ back_href }}">Back</a>
          <a href="{{ download_href }}">Download JSON</a>
        </div>
        <pre>{{ report | tojson(indent=2) }}</pre>
      </div>
    </div>
  </body>
</html>
